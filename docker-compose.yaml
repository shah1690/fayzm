# Fayzm monorepo — infra only. The apps (Next.js frontend, Django backend) run
# locally on the host (ports 3000 / 8000). Only the stateful services run in
# Docker: PostgreSQL + MinIO. Start with:  pnpm infra   (or docker compose up -d)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fayzm_db}
      POSTGRES_USER: ${DB_USER:-fayzm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fayzm_password_change_me}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # S3-compatible object storage for all media files (uploads, PDFs, images).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Creates the media bucket and makes it publicly readable.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-fayzm-media}
    entrypoint: >
      sh -c "
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing minio/$$MINIO_BUCKET_NAME &&
        mc anonymous set download minio/$$MINIO_BUCKET_NAME &&
        echo 'MinIO bucket ready.'
      "
    restart: on-failure

volumes:
  postgres_data:
  minio_data:
