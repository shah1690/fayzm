services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: https://media.fayzm.uz
      MINIO_BUCKET: ${MINIO_BUCKET:-fayzm-media}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      minio:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - fayzm

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fayzm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      MINIO_BROWSER_REDIRECT: ${MINIO_BROWSER_REDIRECT:-off}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fayzm

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fayzm_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-fayzm-media}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET
    networks:
      - fayzm

  media:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-fayzm-media}
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          server_name _;
          client_max_body_size 0;

          location = / {
            add_header Content-Type text/plain;
            return 200 "Fayzm media storage\n";
          }

          location /__MINIO_BUCKET__/ {
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_pass http://minio:9000;
          }

          location / {
            rewrite ^/(.*)$ /__MINIO_BUCKET__/$1 break;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_pass http://minio:9000;
          }
        }
        EOF
        sed -i "s/__MINIO_BUCKET__/$${MINIO_BUCKET}/g" /etc/nginx/conf.d/default.conf
        nginx -g 'daemon off;'
    expose:
      - "80"
    networks:
      - fayzm

volumes:
  minio_data:

networks:
  fayzm:
    driver: bridge
