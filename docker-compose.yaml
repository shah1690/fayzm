# Fayzm — single stack. Local dev: run `docker compose up -d db minio minio-init`
# and the apps on the host (pnpm dev). Production: `docker compose up -d --build`
# runs everything; Traefik (joined to the `proxy` network) routes the domains.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fayzm_db}
      POSTGRES_USER: ${DB_USER:-fayzm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fayzm_password_change_me}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
      MINIO_BROWSER_REDIRECT: ${MINIO_BROWSER_REDIRECT:-on}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.fayzm-media.rule=Host(`media.fayzm.uz`)
      - traefik.http.routers.fayzm-media.entrypoints=https
      - traefik.http.routers.fayzm-media.tls.certresolver=letsencrypt
      - traefik.http.routers.fayzm-media.service=fayzm-media
      - traefik.http.routers.fayzm-media.middlewares=fayzm-media-prefix
      - traefik.http.middlewares.fayzm-media-prefix.addprefix.prefix=/${MINIO_BUCKET_NAME:-fayzm-media}
      - traefik.http.services.fayzm-media.loadbalancer.server.port=9000
      - traefik.http.routers.fayzm-minio-console.rule=Host(`minioinit.fayzm.uz`)
      - traefik.http.routers.fayzm-minio-console.entrypoints=https
      - traefik.http.routers.fayzm-minio-console.tls.certresolver=letsencrypt
      - traefik.http.routers.fayzm-minio-console.service=fayzm-minio-console
      - traefik.http.services.fayzm-minio-console.loadbalancer.server.port=9001

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-fayzm-media}
    networks:
      - internal
    entrypoint: >
      sh -c "
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing minio/$$MINIO_BUCKET_NAME &&
        mc anonymous set download minio/$$MINIO_BUCKET_NAME &&
        echo 'MinIO bucket ready.'
      "
    restart: on-failure

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Container-network facts (always the compose service names).
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MINIO_INTERNAL_ENDPOINT: minio:9000
      # Everything else from the deploy env (Coolify / .env).
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-False}
      ENABLE_HTTPS_REDIRECT: ${ENABLE_HTTPS_REDIRECT:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-back.fayzm.uz}
      BACKEND_URL: ${BACKEND_URL:-https://back.fayzm.uz}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://fayzm.uz}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://back.fayzm.uz,https://fayzm.uz}
      DB_NAME: ${DB_NAME:-fayzm_db}
      DB_USER: ${DB_USER:-fayzm_user}
      DB_PASSWORD: ${DB_PASSWORD:-fayzm_password_change_me}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      USE_MINIO: ${USE_MINIO:-True}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-media.fayzm.uz}
      MINIO_CUSTOM_DOMAIN: ${MINIO_CUSTOM_DOMAIN:-media.fayzm.uz}
      MINIO_USE_HTTPS: ${MINIO_USE_HTTPS:-True}
      MINIO_INTERNAL_USE_HTTPS: ${MINIO_INTERNAL_USE_HTTPS:-False}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-fayzm-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      FRONTEND_URL: ${FRONTEND_URL:-https://fayzm.uz}
      TZ: ${TZ:-Asia/Tashkent}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - static_files:/app/staticfiles
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.fayzm-backend.rule=Host(`back.fayzm.uz`)
      - traefik.http.routers.fayzm-backend.entrypoints=https
      - traefik.http.routers.fayzm-backend.tls.certresolver=letsencrypt
      - traefik.http.services.fayzm-backend.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://fayzm.uz}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://back.fayzm.uz}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-https://media.fayzm.uz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      AMOCRM_FORM_ID: ${AMOCRM_FORM_ID:-}
      AMOCRM_FORM_HASH: ${AMOCRM_FORM_HASH:-}
    depends_on:
      backend:
        condition: service_started
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.fayzm-frontend.rule=Host(`fayzm.uz`)
      - traefik.http.routers.fayzm-frontend.entrypoints=https
      - traefik.http.routers.fayzm-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.fayzm-frontend.loadbalancer.server.port=3000

networks:
  internal:
  # Shared with the reverse proxy. Traefik must join this network (in prod set
  # it to `external: true` and `docker network create fayzm_proxy` once, or run
  # Traefik in this compose file).
  proxy:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_files:
