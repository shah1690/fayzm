services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-https://media.fayzm.uz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    expose:
      - "3000"
    networks:
      - fayzm

  media:
    image: nginx:1.27-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;

          sendfile on;
          tcp_nopush on;
          tcp_nodelay on;
          keepalive_timeout 65;
          gzip off;
          etag on;
          if_modified_since exact;

          types {
            application/pdf pdf;
          }
          default_type application/octet-stream;

          add_header Accept-Ranges bytes always;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
          add_header X-Content-Type-Options nosniff always;

          location = / {
            add_header Content-Type text/plain;
            return 200 "Fayzm media storage\n";
          }

          location / {
            try_files $$uri =404;
          }
        }
        EOF
        nginx -g 'daemon off;'
    volumes:
      - media_data:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      - fayzm

volumes:
  media_data:

networks:
  fayzm:
    driver: bridge
